name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  ui-tests:
    name: UI tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build settings page
        run: node test/build-page.js
      - name: Install jsdom
        run: npm install --no-save jsdom
        working-directory: test
      - name: Run UI checks
        run: node ui.test.js
        working-directory: test

  go-tests:
    name: Go tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: client/go.sum
      - name: Version matches tag
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/appid/appid.go)
          if [ "$want" != "$have" ]; then
            echo "тег $want не совпадает с appid.Version $have"
            exit 1
          fi
        working-directory: client
      - name: Unit tests
        run: go test ./internal/...
        working-directory: client
      - name: Install MinGW toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Vet (Windows target)
        run: |
          touch setup/payload.zip
          GOOS=windows CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go vet -unsafeptr=false ./...
        working-directory: client

  build:
    name: Build Windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build (no model bundled)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          target: dist-slim
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package portable archive
        run: |
          cd dist
          zip -9 ../holdtotype-portable.zip holdtotype.exe whisper-server.exe llama-server.exe config.default.json README.md
      - uses: actions/upload-artifact@v4
        with:
          name: holdtotype-binaries
          path: |
            dist/holdtotype-setup.exe
            holdtotype-portable.zip
