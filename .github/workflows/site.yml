name: Site

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild the site with the new release
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the release files
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for i in $(seq 1 60); do
            n=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '[.assets[] | select(.state == "uploaded")] | length')
            if [ "$n" -ge 2 ]; then
              echo "$TAG has $n files"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::$TAG still has fewer than two files after ten minutes, the site is rebuilt anyway"

      - name: Ask the site to rebuild
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The SITE_DISPATCH_TOKEN secret is missing, so the site does not learn about the release"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"event_type":"app-release"}' \
            https://api.github.com/repos/Vitalii-Yemets/holdtotype-site/dispatches
          echo "the site rebuild is requested"
